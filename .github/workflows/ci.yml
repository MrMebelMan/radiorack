name: CI

# Lint and test every change to the site; deploy master to radiorack.dr1v3.cz.
# Docs-only changes (*.md, .claude/, root PDFs) trigger nothing.
on:
  push:
    branches: [master]
    paths:
      - 'sim/**'
      - '!**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - 'wrangler.jsonc'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'sim/**'
      - '!**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - 'wrangler.jsonc'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://radiorack.dr1v3.cz
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # Repository variable SELF_HOST_MANUALS=true serves the PDFs from sim/manuals/;
      # otherwise the manual buttons link to each manual's public source and the PDFs are not uploaded.
      - name: Link manuals to their sources
        if: vars.SELF_HOST_MANUALS != 'true'
        run: |
          sed -i 's/^export const SELF_HOST_MANUALS = true;$/export const SELF_HOST_MANUALS = false;/' sim/config.js
          grep -q '^export const SELF_HOST_MANUALS = false;$' sim/config.js
          echo 'manuals/' >> sim/.assetsignore
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # wrangler decorates its output with emoji; strip non-ASCII from the log.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -o pipefail
          npx --yes wrangler@4.147.0 deploy 2>&1 | perl -pe 's/[^\x00-\x7F]//g'
